name: Build Akon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir build_project

          unzip -q Akon_Android_Project.zip -d build_project

          PROJECT_DIR="build_project/Akon_Android_Project"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Không tìm thấy settings.gradle.kts"
            exit 1
          fi

          echo "Android project found:"
          ls -la "$PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd build_project/Akon_Android_Project

          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Akon-debug-apk
          path: build_project/Akon_Android_Project/app/build/outputs/apk/debug/app-debug.apk
