name: Build Akon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir build_project

          unzip -q Akon_Android_Project.zip -d build_project

          SETTINGS_FILE=$(find build_project -name "settings.gradle.kts" -type f -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Không tìm thấy settings.gradle.kts trong ZIP"
            echo "Nội dung ZIP:"
            find build_project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Java and Kotlin JVM target
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "Không tìm thấy app/build.gradle.kts"
            exit 1
          fi

          cat >> "$APP_GRADLE" <<'EOF'

          // CI JVM compatibility fix
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

          echo "Đã ép Java và Kotlin cùng sử dụng JVM 17."

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Akon-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
