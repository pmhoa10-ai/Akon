name: Build Akon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/pmhoa10/akon

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Akon"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pmhoa10.akon'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.pmhoa10.akon'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Akon"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <receiver
                      android:name=".ReminderReceiver"
                      android:exported="false" />

              </application>

          </manifest>
          EOF

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#4CAF50</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#111111</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/pmhoa10/akon/MainActivity.java <<'EOF'
          package com.pmhoa10.akon;

          import android.Manifest;
          import android.app.AlarmManager;
          import android.app.DatePickerDialog;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends android.app.Activity {

              private SharedPreferences prefs;

              private final String[] schedule = {
                  "Buổi 1","Buổi 2","Buổi 3","REST",
                  "Buổi 4","Buổi 5","Buổi 6","REST",
                  "Buổi 7","Buổi 8","Buổi 9","REST",
                  "Buổi 10","Buổi 11","Buổi 12","REST",
                  "Buổi 13","Buổi 14","Buổi 15","REST",
                  "Buổi 16","Buổi 17","Buổi 18","REST",
                  "Buổi 19","Buổi 20","Buổi 21","Buổi 22","REST",
                  "Buổi 23","Buổi 24","Buổi 25","Buổi 26","REST",
                  "Buổi 27","Buổi 28","Buổi 29","Buổi 30","REST",
                  "Buổi 1 + Buổi 2","Buổi 3 + Buổi 4",
                  "Buổi 5 + Buổi 6","Buổi 7 + Buổi 8","REST",
                  "Buổi 9 + Buổi 10","Buổi 11 + Buổi 12",
                  "Buổi 13 + Buổi 14","Buổi 15 + Buổi 16","REST",
                  "Buổi 17 + Buổi 18","Buổi 19 + Buổi 20",
                  "Buổi 21 + Buổi 22","REST",
                  "Buổi 23 + Buổi 24","Buổi 25 + Buổi 26",
                  "Buổi 27 + Buổi 28","Buổi 29 + Buổi 30",
                  "Chưa có dữ liệu","Chưa có dữ liệu","Chưa có dữ liệu"
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences("akon", MODE_PRIVATE);

                  createNotificationChannel();

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                          new String[]{Manifest.permission.POST_NOTIFICATIONS},
                          100
                      );
                  }

                  buildUI();
                  scheduleReminder();
              }

              private void buildUI() {

                  ScrollView scroll = new ScrollView(this);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(32, 40, 32, 40);

                  TextView title = new TextView(this);
                  title.setText("AKON");
                  title.setTextSize(32);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 0, 0, 10);

                  root.addView(title);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("60 NGÀY • KẾ HOẠCH TẬP LUYỆN");
                  subtitle.setTextSize(16);
                  subtitle.setGravity(Gravity.CENTER);
                  root.addView(subtitle);

                  Button startDate = new Button(this);
                  startDate.setText("📅 Chọn ngày bắt đầu");
                  startDate.setOnClickListener(v -> chooseStartDate());
                  root.addView(startDate);

                  Button today = new Button(this);
                  today.setText("▶ Xem ngày tập hôm nay");
                  today.setOnClickListener(v -> showCurrentDay());
                  root.addView(today);

                  TextView linksTitle = new TextView(this);
                  linksTitle.setText("\nTÀI NGUYÊN");
                  linksTitle.setTextSize(22);
                  root.addView(linksTitle);

                  addLink(root, "▶ Playlist 30 buổi",
                      "https://youtube.com/playlist?list=PLbcgW9WsYf0GZA3OdCVqM2c7evWIP_N9T");

                  addLink(root, "🪜 Bài tập xà",
                      "https://youtu.be/HjOn927LayE");

                  addLink(root, "🤸 Bài thay thế / bổ sung",
                      "https://youtu.be/RKIfXm62zcs");

                  addLink(root, "▶ Chương trình gốc",
                      "https://youtu.be/kqsNqZOwIB0");

                  addLink(root, "👥 Facebook",
                      "https://www.facebook.com/share/g/1FGifmCA9j/");

                  TextView scheduleTitle = new TextView(this);
                  scheduleTitle.setText("\nLỊCH 60 NGÀY");
                  scheduleTitle.setTextSize(22);
                  root.addView(scheduleTitle);

                  for (int i = 0; i < schedule.length; i++) {

                      final int day = i + 1;

                      Button b = new Button(this);
                      b.setText("Ngày " + day + "  •  " + schedule[i]);

                      if (prefs.getBoolean("done_" + day, false)) {
                          b.setText("✓ Ngày " + day + "  •  " + schedule[i]);
                      }

                      b.setOnClickListener(v -> {

                          if (schedule[day - 1].equals("REST")) {
                              Toast.makeText(
                                  this,
                                  "Ngày nghỉ 😴",
                                  Toast.LENGTH_SHORT
                              ).show();
                          } else {
                              openUrl(
                                  "https://youtube.com/playlist?list=PLbcgW9WsYf0GZA3OdCVqM2c7evWIP_N9T"
                              );
                          }

                          prefs.edit()
                              .putBoolean(
                                  "done_" + day,
                                  !prefs.getBoolean("done_" + day, false)
                              )
                              .apply();

                          buildUI();
                      });

                      root.addView(b);
                  }

                  scroll.addView(root);
                  setContentView(scroll);
              }

              private void addLink(
                  LinearLayout root,
                  String text,
                  String url
              ) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setOnClickListener(v -> openUrl(url));
                  root.addView(b);
              }

              private void openUrl(String url) {
                  try {
                      Intent intent =
                          new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      startActivity(intent);
                  } catch (Exception e) {
                      Toast.makeText(
                          this,
                          "Không thể mở liên kết",
                          Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              private void chooseStartDate() {

                  Calendar now = Calendar.getInstance();

                  DatePickerDialog dialog =
                      new DatePickerDialog(
                          this,
                          (view, year, month, day) -> {

                              Calendar selected =
                                  Calendar.getInstance();

                              selected.set(
                                  year,
                                  month,
                                  day,
                                  0,
                                  0,
                                  0
                              );

                              prefs.edit()
                                  .putLong(
                                      "start_date",
                                      selected.getTimeInMillis()
                                  )
                                  .apply();

                              Toast.makeText(
                                  this,
                                  "Đã lưu ngày bắt đầu",
                                  Toast.LENGTH_SHORT
                              ).show();
                          },
                          now.get(Calendar.YEAR),
                          now.get(Calendar.MONTH),
                          now.get(Calendar.DAY_OF_MONTH)
                      );

                  dialog.show();
              }

              private void showCurrentDay() {

                  long start = prefs.getLong("start_date", -1);

                  if (start == -1) {
                      Toast.makeText(
                          this,
                          "Hãy chọn ngày bắt đầu trước",
                          Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  long diff =
                      System.currentTimeMillis() - start;

                  int day =
                      (int)(diff / (24L * 60L * 60L * 1000L)) + 1;

                  if (day < 1) day = 1;

                  if (day > 60) {
                      Toast.makeText(
                          this,
                          "Bạn đã hoàn thành 60 ngày! 🎉",
                          Toast.LENGTH_LONG
                      ).show();
                      return;
                  }

                  Toast.makeText(
                      this,
                      "Hôm nay: Ngày " + day +
                      " • " + schedule[day - 1],
                      Toast.LENGTH_LONG
                  ).show();
              }

              private void createNotificationChannel() {

                  if (Build.VERSION.SDK_INT >= 26) {

                      android.app.NotificationChannel channel =
                          new android.app.NotificationChannel(
                              "akon_reminder",
                              "Akon Reminder",
                              android.app.NotificationManager.IMPORTANCE_DEFAULT
                          );

                      android.app.NotificationManager manager =
                          getSystemService(
                              android.app.NotificationManager.class
                          );

                      manager.createNotificationChannel(channel);
                  }
              }

              private void scheduleReminder() {

                  AlarmManager alarm =
                      (AlarmManager)getSystemService(
                          Context.ALARM_SERVICE
                      );

                  Intent intent =
                      new Intent(this, ReminderReceiver.class);

                  PendingIntent pending =
                      PendingIntent.getBroadcast(
                          this,
                          123,
                          intent,
                          PendingIntent.FLAG_UPDATE_CURRENT |
                          PendingIntent.FLAG_IMMUTABLE
                      );

                  Calendar time = Calendar.getInstance();

                  time.set(Calendar.HOUR_OF_DAY, 19);
                  time.set(Calendar.MINUTE, 0);
                  time.set(Calendar.SECOND, 0);

                  if (time.getTimeInMillis()
                      <= System.currentTimeMillis()) {

                      time.add(Calendar.DAY_OF_YEAR, 1);
                  }

                  alarm.setInexactRepeating(
                      AlarmManager.RTC_WAKEUP,
                      time.getTimeInMillis(),
                      AlarmManager.INTERVAL_DAY,
                      pending
                  );
              }
          }
          EOF

          cat > app/src/main/java/com/pmhoa10/akon/ReminderReceiver.java <<'EOF'
          package com.pmhoa10.akon;

          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import androidx.core.app.NotificationCompat;

          public class ReminderReceiver extends BroadcastReceiver {

              @Override
              public void onReceive(Context context, Intent intent) {

                  NotificationManager manager =
                      (NotificationManager)
                      context.getSystemService(
                          Context.NOTIFICATION_SERVICE
                      );

                  Intent open =
                      new Intent(context, MainActivity.class);

                  PendingIntent pending =
                      PendingIntent.getActivity(
                          context,
                          1,
                          open,
                          PendingIntent.FLAG_UPDATE_CURRENT |
                          PendingIntent.FLAG_IMMUTABLE
                      );

                  NotificationCompat.Builder notification =
                      new NotificationCompat.Builder(
                          context,
                          "akon_reminder"
                      )
                      .setSmallIcon(
                          android.R.drawable.ic_popup_reminder
                      )
                      .setContentTitle("Akon • Nhắc tập")
                      .setContentText(
                          "Đã đến giờ kiểm tra lịch tập hôm nay 💪"
                      )
                      .setPriority(
                          NotificationCompat.PRIORITY_DEFAULT
                      )
                      .setAutoCancel(true)
                      .setContentIntent(pending);

                  manager.notify(1001, notification.build());
              }
          }
          EOF

          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Akon-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
